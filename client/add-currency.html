        // Full currency list with correct country codes for flags
        const CURRENCIES = [

            {code: "GBP", name: "British Pound", cc: "gb"},
            {code: "JPY", name: "Japanese Yen", cc: "jp"},
            {code: "EUR", name: "Euro", cc: "eu"},
            {code: "AUD", name: "Australian Dollar", cc: "au"},
            {code: "SGD", name: "Singapore Dollar", cc: "sg"},
            {code: "HKD", name: "Hong Kong Dollar", cc: "hk"},
            {code: "CAD", name: "Canadian Dollar", cc: "ca"},
            {code: "CHF", name: "Swiss Franc", cc: "ch"},
            {code: "NZD", name: "New Zealand Dollar", cc: "nz"},
            {code: "TWD", name: "Taiwan Dollar", cc: "tw"},
            {code: "KRW", name: "South Korean Won", cc: "kr"},
            {code: "INR", name: "Indian Rupee", cc: "in"},
            {code: "DKK", name: "Danish Krone", cc: "dk"},
            {code: "SEK", name: "Swedish Krona", cc: "se"},
            {code: "NOK", name: "Norwegian Krone", cc: "no"},
            {code: "ZAR", name: "South African Rand", cc: "za"},
            {code: "THB", name: "Thai Baht", cc: "th"},
            {code: "CNY", name: "Chinese Yuan", cc: "cn"},
            {code: "IDR", name: "Indonesian Rupiah", cc: "id"},
            {code: "SAR", name: "Saudi Riyal", cc: "sa"},
            {code: "MYR", name: "Malaysian Ringgit", cc: "my"},
            {code: "PHP", name: "Philippine Peso", cc: "ph"},
            {code: "PKR", name: "Pakistani Rupee", cc: "pk"},
            {code: "VND", name: "Vietnamese Dong", cc: "vn"},
            {code: "OMR", name: "Omani Rial", cc: "om"},
            {code: "JOD", name: "Jordanian Dinar", cc: "jo"},
            {code: "AED", name: "UAE Dirham", cc: "ae"},
            {code: "BHD", name: "Bahraini Dinar", cc: "bh"},
            {code: "BND", name: "Brunei Dollar", cc: "bn"},
            {code: "EGP", name: "Egyptian Pound", cc: "eg"},
            {code: "QAR", name: "Qatari Riyal", cc: "qa"},
            {code: "KWD", name: "Kuwaiti Dinar", cc: "kw"},
            {code: "LKR", name: "Sri Lankan Rupee", cc: "lk"},
            {code: "BDT", name: "Bangladeshi Taka", cc: "bd"},
            {code: "MOP", name: "Macanese Pataca", cc: "mo"},
            {code: "SCR", name: "Seychellois Rupee", cc: "sc"},
            {code: "IQD", name: "Iraqi Dinar", cc: "iq"},
            {code: "TRY", name: "Turkish Lira", cc: "tr"},
            {code: "RUB", name: "Russian Ruble", cc: "ru"},
            {code: "NPR", name: "Nepalese Rupee", cc: "np"},
            {code: "CZK", name: "Czech Koruna", cc: "cz"},
            {code: "KHR", name: "Cambodian Riel", cc: "kh"}
        ];
        // Populate dropdown with all standard currencies plus Other.
        const select = document.getElementById("currency");
        CURRENCIES.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c.code;
            opt.textContent = `${c.code} — ${c.name}`;
            select.appendChild(opt);
        });

        const otherOpt = document.createElement("option");
        otherOpt.value = "__OTHER__";
        otherOpt.textContent = "Other — Custom Currency";
        select.appendChild(otherOpt);

        const customCurrencyFields = document.getElementById("customCurrencyFields");
        const customCurrencyCode = document.getElementById("customCurrencyCode");
        const customCurrencyName = document.getElementById("customCurrencyName");
        const customCurrencyFlag = document.getElementById("customCurrencyFlag");
        const flagPreview = document.getElementById("flagPreview");

        function updateFlagPreview() {
            const selected = customCurrencyFlag.options[customCurrencyFlag.selectedIndex];
            if (customCurrencyFlag.value) {
                flagPreview.textContent = selected.textContent.split(" ")[0];
                flagPreview.style.display = "block";
            } else {
                flagPreview.textContent = "";
                flagPreview.style.display = "none";
            }
        }

        customCurrencyFlag.addEventListener("change", updateFlagPreview);

        select.addEventListener("change", () => {
            const isOther = select.value === "__OTHER__";
            customCurrencyFields.style.display = isOther ? "block" : "none";
            customCurrencyCode.required = isOther;
            customCurrencyName.required = isOther;

            if (!isOther) {
                customCurrencyCode.value = "";
                customCurrencyName.value = "";
                customCurrencyFlag.value = "";
                updateFlagPreview();
            }
        });

        function togglePreorder(which) {
            const checked = document.getElementById(which + "Preorder").checked;
            const rateInput = document.getElementById(which === "buy" ? "buyingRate" : "sellingRate");
            rateInput.disabled = checked;
            rateInput.required = !checked;
            if (checked) rateInput.value = "";
        }

        async function addCurrency(e) {
            e.preventDefault();
            const errorEl = document.getElementById("error-msg");
            const successEl = document.getElementById("success-msg");
            errorEl.style.display = "none";
            successEl.style.display = "none";

            const buyPreorder = document.getElementById("buyPreorder").checked;
            const sellPreorder = document.getElementById("sellPreorder").checked;
            const isOther = select.value === "__OTHER__";

            let currencyCode = select.value;
            let currencyName = "";
            let currencyFlag = "";

            if (isOther) {
                currencyFlag = customCurrencyFlag.value;
                currencyCode = customCurrencyCode.value.trim().toUpperCase();
                currencyName = customCurrencyName.value.trim();

                if (!/^[A-Z]{3}$/.test(currencyCode)) {
                    errorEl.textContent = "Enter a valid 3-letter currency code, e.g. XAF.";
                    errorEl.style.display = "block";
                    return;
                }

                if (!currencyName) {
                    errorEl.textContent = "Enter the currency name.";
                    errorEl.style.display = "block";
                    return;
                }

                if (!currencyFlag) {
                    errorEl.textContent = "Select a country / flag.";
                    errorEl.style.display = "block";
                    return;
                }
            }

            if (!buyPreorder && document.getElementById("buyingRate").value === "") {
                errorEl.textContent = "Enter a buying rate or mark it as pre-order.";
                errorEl.style.display = "block";
                return;
            }
            if (!sellPreorder && document.getElementById("sellingRate").value === "") {
                errorEl.textContent = "Enter a selling rate or mark it as pre-order.";
                errorEl.style.display = "block";
                return;
            }

            const payload = {
                currency: currencyCode,
                currencyName: currencyName || (CURRENCIES.find(c => c.code === currencyCode)?.name || ""),
                currencyFlag: currencyFlag || (CURRENCIES.find(c => c.code === currencyCode)?.cc || ""),
                unit: parseInt(document.getElementById("unit").value) || 1,
                buyingRate: buyPreorder ? 0 : parseFloat(document.getElementById("buyingRate").value),
                sellingRate: sellPreorder ? 0 : parseFloat(document.getElementById("sellingRate").value),
                decimals: parseInt(document.getElementById("decimals").value),
                buyPreorder: buyPreorder,
                sellPreorder: sellPreorder
            };

            try {
                const res = await fetch("/api/currencies", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    credentials: "include",
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    if ("BroadcastChannel" in window) {
                        new BroadcastChannel("showcash-board-updates").postMessage("refresh");
                    }
                    successEl.textContent = `${payload.currency} added successfully!`;
                    successEl.style.display = "block";
                    document.getElementById("currencyForm").reset();
                    document.getElementById("unit").value = "1";
                    customCurrencyFields.style.display = "none";
                    customCurrencyCode.required = false;
                    customCurrencyName.required = false;
                    customCurrencyFlag.value = "";
                    updateFlagPreview();
                    togglePreorder("buy");
                    togglePreorder("sell");
                } else {
                    errorEl.textContent = data.error || "Failed to add currency";
                    errorEl.style.display = "block";
                }
            } catch {
                errorEl.textContent = "Could not reach server. Please try again.";
                errorEl.style.display = "block";
            }
        }
    </script>
</body>

</html>
