        /* Glowing outline on the divider lines between currencies. A real
           box-shadow bleeding out of a row's edge gets painted OVER by the
           next (opaque) row's background, since that row is later in paint
           order — so instead we draw the glow as its own thin layer with a
           positive z-index, which always paints above the z-index:auto row
           backgrounds regardless of DOM order. */

            content: "";
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 2px;
            background: var(--neon);

            z-index: 3;
            pointer-events: none;

        .currency-row.left-col::before {
            content: "";

            renderSecondaryGroup();
        }, SECONDARY_ROTATE_MS);
    } else if (secondaryGroups.length <= 1 && secondaryTimer) {
        clearInterval(secondaryTimer);
        secondaryTimer = null;
    }
}

function secCard(c, idx) {
    const buyHtml = c.buyPreorder
        ? `<span class="sec-val preorder-val">PRE-ORDER</span>`
        : `<span class="sec-val">${c.buyingRate.toFixed(c.decimals)}</span>`;
    const sellHtml = c.sellPreorder
        ? `<span class="sec-val preorder-val">PRE-ORDER</span>`
        : `<span class="sec-val">${c.sellingRate.toFixed(c.decimals)}</span>`;
    const cardStyle = c.rowColor ? ` style="--row-color:${c.rowColor};"` : "";
    return `
    <div class="sec-card"${cardStyle}>
        <div class="sec-card-top">
<<<<<<< HEAD
            ${flagWaveHtml(flagUrl(c), c.currency, "sec-flag")}
            <div class="sec-code">${c.currency}</div>
=======
            ${flagWaveHtml(c, "sec-flag")}
            <div class="sec-code-wrap">
                <div class="sec-code">${c.currency}</div>
            </div>
>>>>>>> 3b468a2 (changes of boards)
        </div>
        <div class="sec-rates">
            <div class="sec-rate-box"><span class="sec-lbl">Buy</span>${buyHtml}</div>
            <div class="sec-rate-box"><span class="sec-lbl">Sell</span>${sellHtml}</div>
        </div>
    </div>`;
}

function renderSecondaryGroup() {
    const grid = document.getElementById("secondaryGrid");
    const group = secondaryGroups[secondaryGroupIdx];
    grid.innerHTML = group.map(secCard).join("");
    // restart the fade-in animation
    grid.style.animation = "none";
    void grid.offsetWidth;
    grid.style.animation = "";
    // Different rotation groups can render at slightly different heights
    // (e.g. a shorter final group) — re-check the fit each time so nothing
    // silently gets clipped after the first group.
    applyFitScale(desiredFontScale);
}

function updateClock() {
    const now = new Date();
    const datePart = now.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    const timePart = now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    document.getElementById("boardClock").textContent = `${datePart} · ${timePart}`;
}

loadRates();
updateClock();
setInterval(loadRates, 15000);   // fallback poll, in case the broadcast is missed
setInterval(updateClock, 1000);

// ── Instant refresh: the admin page (index.html / account.html) posts a
// message here the moment a currency, board color, name or logo is saved,
// so the TV board updates immediately instead of waiting for the poll.
if ("BroadcastChannel" in window) {
    const channel = new BroadcastChannel("showcash-board-updates");
    channel.onmessage = () => loadRates();
}
</script>
