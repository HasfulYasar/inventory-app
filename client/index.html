<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home — SHOWCASH</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .floating-save {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #f0c040;
            color: #1a1a2e;
            border: none;
            font-weight: 700;
            font-size: 14px;
            padding: 12px 22px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            z-index: 200;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .floating-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <div class="page-header-text">
            <h2>Home</h2>
            <p>Manage and control your currency rates</p>
        </div>
        <button class="btn btn-gold" id="editBtn" onclick="toggleEditMode()">✎ Edit</button>
    </div>

    <div class="card">
        <div id="error-msg" class="error-msg" style="display:none;"></div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Currency</th>
                        <th>Buying Rate</th>
                        <th>Selling Rate</th>
                        <th>Decimals</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" class="empty-state">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<button class="floating-save" id="floatingSave" style="display:none;" onclick="saveAllChanges()">💾 Save All</button>

<script src="navbar.js"></script>
<script>
const CURRENCY_COUNTRY = {
    USD:"us",GBP:"gb",JPY:"jp",EUR:"eu",AUD:"au",SGD:"sg",HKD:"hk",
    CAD:"ca",CHF:"ch",NZD:"nz",TWD:"tw",KRW:"kr",INR:"in",THB:"th",
    CNY:"cn",IDR:"id",SAR:"sa",MYR:"my",PHP:"ph",VND:"vn",AED:"ae",
    BND:"bn",TRY:"tr",DKK:"dk",SEK:"se",NOK:"no",ZAR:"za",PKR:"pk",
    OMR:"om",JOD:"jo",BHD:"bh",EGP:"eg",QAR:"qa",KWD:"kw",LKR:"lk",
    BDT:"bd",MOP:"mo",SCR:"sc",IQD:"iq",RUB:"ru"
};

const errorMsg = document.getElementById("error-msg");
let allData = [];
let editModeActive = false;

function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = "block"; }
function hideError() { errorMsg.style.display = "none"; }

function flagImg(code) {
    const cc = CURRENCY_COUNTRY[code] || "un";
    return `<img class="flag-img" src="https://flagcdn.com/w40/${cc}.png" alt="${code}" onerror="this.style.display='none'">`;
}
function flagCell(code) {
    return `<div class="currency-cell">${flagImg(code)}<strong>${code}</strong></div>`;
}

async function loadCurrencies() {
    try {
        const res = await fetch("/api/currencies", { credentials: "include" });
        if (res.status === 401) { window.location.href = "/login"; return; }
        if (!res.ok) throw new Error();
        allData = await res.json();
        hideError();
        renderTable();
    } catch {
        showError("Could not load currencies. Please refresh.");
    }
}

function renderTable() {
    const tbody = document.getElementById("tableBody");
    if (allData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No currencies yet.</td></tr>`;
        return;
    }

    let rows = "";
    allData.forEach((c, i) => {
        if (editModeActive) {
            rows += `
            <tr class="edit-row">
                <td>${i + 1}</td>
                <td>${flagCell(c.currency)}</td>
                <td><input class="input" id="e-buying-${c.id}" type="number" value="${c.buyingRate}" step="any" min="0"></td>
                <td><input class="input" id="e-selling-${c.id}" type="number" value="${c.sellingRate}" step="any" min="0"></td>
                <td>
                    <select id="e-decimals-${c.id}" class="input" style="min-width:65px;">
                        ${[0,1,2,3,4].map(d=>`<option value="${d}" ${c.decimals===d?'selected':''}>${d}</option>`).join('')}
                    </select>
                </td>
                <td><span class="${c.active?'badge-on':'badge-off'}">${c.active?'ON':'OFF'}</span></td>
                <td>—</td>
            </tr>`;
        } else {
            rows += `
            <tr>
                <td>${i + 1}</td>
                <td>${flagCell(c.currency)}</td>
                <td>${c.buyingRate.toFixed(c.decimals)}</td>
                <td>${c.sellingRate.toFixed(c.decimals)}</td>
                <td>${c.decimals}</td>
                <td><span class="${c.active?'badge-on':'badge-off'}">${c.active?'ON':'OFF'}</span></td>
                <td>
                    <div class="actions-cell">
                        <button class="btn btn-xs toggle-btn ${c.active?'on':'off'}" onclick="toggleCurrency(${c.id})">${c.active?'Turn OFF':'Turn ON'}</button>
                        <button class="btn btn-danger btn-xs" onclick="deleteCurrency(${c.id})">Delete</button>
                    </div>
                </td>
            </tr>`;
        }
    });
    tbody.innerHTML = rows;
}

function toggleEditMode() {
    editModeActive = !editModeActive;
    document.getElementById("floatingSave").style.display = editModeActive ? "block" : "none";
    document.getElementById("editBtn").textContent = editModeActive ? "✕ Cancel" : "✎ Edit";
    renderTable();
}

async function saveAllChanges() {
    const updates = allData.map(c => {
        const buyingRate  = parseFloat(document.getElementById(`e-buying-${c.id}`).value);
        const sellingRate = parseFloat(document.getElementById(`e-selling-${c.id}`).value);
        const decimals    = parseInt(document.getElementById(`e-decimals-${c.id}`).value);
        return { id: c.id, currency: c.currency, unit: c.unit, buyingRate, sellingRate, decimals };
    });

    if (updates.some(u => isNaN(u.buyingRate) || isNaN(u.sellingRate))) {
        showError("Please fill in all rate fields before saving.");
        return;
    }

    try {
        const results = await Promise.all(updates.map(u =>
            fetch(`/api/currencies/${u.id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                    currency: u.currency, unit: u.unit,
                    buyingRate: u.buyingRate, sellingRate: u.sellingRate, decimals: u.decimals
                })
            })
        ));
        if (results.some(r => !r.ok)) {
            showError("Some currencies could not be saved.");
        } else {
            hideError();
        }
        editModeActive = false;
        document.getElementById("floatingSave").style.display = "none";
        document.getElementById("editBtn").textContent = "✎ Edit";
        loadCurrencies();
    } catch {
        showError("Could not reach server. Please try again.");
    }
}

async function toggleCurrency(id) {
    try {
        const res = await fetch(`/api/currencies/${id}/toggle`, { method: "POST", credentials: "include" });
        if (!res.ok) throw new Error();
        loadCurrencies();
    } catch { showError("Could not toggle."); }
}

async function deleteCurrency(id) {
    if (!confirm("Delete this currency?")) return;
    try {
        const res = await fetch(`/api/currencies/${id}`, { method: "DELETE", credentials: "include" });
        if (!res.ok) throw new Error();
        loadCurrencies();
    } catch { showError("Could not delete."); }
}

loadCurrencies();
</script>
</body>
</html>
