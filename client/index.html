<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board — SHOWCASH</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .floating-save {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #f0c040;
            color: #1a1a2e;
            border: none;
            font-weight: 700;
            font-size: 14px;
            padding: 12px 22px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            z-index: 200;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .floating-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }

        .edit-row .drag-handle {
            cursor: grab;
            color: #bbb;
            font-size: 16px;
            text-align: center;
            width: 28px;
        }
        .edit-row.dragging { opacity: 0.4; }
        tr.dragging td { background: #fffbeb !important; }

        .custom-currency-display {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 150px;
        }
        .custom-currency-display .ccd-flag { font-size: 18px; }
        .custom-currency-display .ccd-text { display: flex; flex-direction: column; line-height: 1.25; }
        .custom-currency-display .ccd-code { font-weight: 700; }
        .custom-currency-display .ccd-name { font-size: 11px; color: #888; }
        .pen-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            padding: 2px 4px;
            color: #b8860b;
            flex-shrink: 0;
        }
        .pen-btn:hover { color: #f0c040; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 10px;
            padding: 22px;
            width: 320px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .modal-box h3 { margin-bottom: 14px; }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 14px;
        }

        .color-cell {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .color-cell select.input {
            min-width: 110px;
        }
        .color-cell option {
            font-weight: 700;
        }
        .color-custom-input {
            width: 28px;
            height: 26px;
            padding: 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ── Keep the white card/table background painted across the full
           scrollable width, not just the visible viewport, so scrolling
           right doesn't reveal the page background behind the table. ── */
        .table-wrap {
            background: #fff;
        }
        .table-wrap table {
            background: #fff;
        }

        /* ── Compact edit mode: tighten every column so all 10 fit side by
           side within the screen width, no horizontal scrolling needed. ── */
        body.edit-mode #tableBody tr.edit-row td {
            padding: 6px 5px;
            font-size: 12.5px;
        }
        body.edit-mode .col-num { width: 24px; text-align: center; }
        body.edit-mode .col-currency .currency-cell,
        body.edit-mode .col-currency .custom-currency-display { min-width: 0; gap: 4px; }
        body.edit-mode .col-currency strong { font-size: 12.5px; }
        body.edit-mode .col-unit .input { width: 42px !important; padding: 4px !important; }
        body.edit-mode .col-rate .input { width: 68px !important; padding: 4px !important; margin-bottom: 3px; }
        body.edit-mode .preorder-lbl {
            display: flex; align-items: center; gap: 3px;
            font-size: 9.5px; color: #888; font-weight: 500; white-space: nowrap;
        }
        body.edit-mode .col-decimals .input { min-width: 44px !important; padding: 4px !important; }
        body.edit-mode .col-color .color-cell { gap: 3px; }
        body.edit-mode .col-color select.input { min-width: 74px !important; font-size: 11.5px !important; padding: 4px !important; }
        body.edit-mode .col-color .color-custom-input { width: 20px; height: 20px; }
        body.edit-mode .col-actions .actions-cell { display: flex; gap: 4px; }
        body.edit-mode .col-actions .btn { padding: 4px 7px !important; font-size: 11px !important; white-space: nowrap; }
        body.edit-mode .col-actions .del-btn {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: #c0392b;
        }
        body.edit-mode .col-actions .del-btn svg { flex-shrink: 0; }
    </style>

</head>

<div class="container">

        <div class="page-header-text">
            <h2>Exchange Board</h2>

    <div class="card">
        <div id="error-msg" class="error-msg" style="display:none;"></div>
        <div class="table-wrap">

                        <th>Selling Rate</th>

                        <th class="edit-only" style="display:none;">Color</th>

                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" class="empty-state">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// Suggested row-highlight colors — curated to read well against the board's
// dark background. Admins can still pick any custom color via the dropdown.
const ROW_COLOR_PRESETS = [
    { name: "Gold",   color: "#F0C040" },
    { name: "Green",  color: "#12B76A" },
    { name: "Red",    color: "#F04438" },
    { name: "Blue",   color: "#2E90FA" },
    { name: "Purple", color: "#9E77ED" },
    { name: "Orange", color: "#FD853A" },
    { name: "Teal",   color: "#15B79E" },
    { name: "Pink",   color: "#EE46BC" }
];

const CURRENCY_COUNTRY = {
    USD:"us",GBP:"gb",JPY:"jp",EUR:"eu",AUD:"au",SGD:"sg",HKD:"hk",
    CAD:"ca",CHF:"ch",NZD:"nz",TWD:"tw",KRW:"kr",INR:"in",THB:"th",
    CNY:"cn",IDR:"id",SAR:"sa",MYR:"my",PHP:"ph",VND:"vn",AED:"ae",
    BND:"bn",TRY:"tr",DKK:"dk",SEK:"se",NOK:"no",ZAR:"za",PKR:"pk",
    OMR:"om",JOD:"jo",BHD:"bh",EGP:"eg",QAR:"qa",KWD:"kw",LKR:"lk",
    BDT:"bd",MOP:"mo",SCR:"sc",IQD:"iq",RUB:"ru",NPR:"np",CZK:"cz",KHR:"kh"
};

// Instantly notifies any open /boards.html tab (e.g. on a TV screen) to
// refresh the moment currencies, board color, name or logo are saved here.
const boardUpdateChannel = "BroadcastChannel" in window ? new BroadcastChannel("showcash-board-updates") : null;
function notifyBoardUpdate() {
    if (boardUpdateChannel) boardUpdateChannel.postMessage("refresh");
}

const errorMsg = document.getElementById("error-msg");
let allData = [];
let editModeActive = false;
let reorderDirty = false;
let draggedId = null;
let customEdits = {};   // id -> { currency, currencyName, currencyFlag } — pending edits for "other" currencies
let modalEditingId = null;

function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = "block"; }
function hideError() { errorMsg.style.display = "none"; }

function flagImg(c) {
    const cc = CURRENCY_COUNTRY[c.currency] || c.currencyFlag || "un";
    return `<img class="flag-img" src="https://flagcdn.com/w40/${cc}.png" alt="${c.currency}" onerror="this.style.display='none'">`;
}
function flagCell(c) {
    return `<div class="currency-cell">${flagImg(c)}<strong>${c.currency}</strong></div>`;
}
function isCustomCurrency(code) {
    return !(code in CURRENCY_COUNTRY);
}
function ccToFlagEmoji(cc) {
    if (!cc || cc.length !== 2) return "🏳️";
    return cc.toUpperCase().replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
}

// ── Currencies ──

async function loadCurrencies() {
    try {
        const res = await fetch("/api/currencies", { credentials: "include" });
        if (res.status === 401) { window.location.href = "/login"; return; }
        if (!res.ok) throw new Error();
        allData = await res.json();
        hideError();
        renderTable();
    } catch {
        showError("Could not load currencies. Please refresh.");
    }
}

function renderTable() {
    const tbody = document.getElementById("tableBody");
    const colspan = editModeActive ? 10 : 5;

    if (allData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${colspan}" class="empty-state">No currencies yet.</td></tr>`;
        return;
    }

    let rows = "";
    allData.forEach((c, i) => {
        if (editModeActive) {
            const isCustom = isCustomCurrency(c.currency);
            const custom = customEdits[c.id] || { currency: c.currency, currencyName: c.currencyName || "", currencyFlag: c.currencyFlag || "" };
            const currencyCell = isCustom ? `
                <div class="custom-currency-display">
                    <span class="ccd-flag">${ccToFlagEmoji(custom.currencyFlag)}</span>
                    <div class="ccd-text">
                        <span class="ccd-code">${custom.currency}</span>
                        <span class="ccd-name">${custom.currencyName}</span>
                    </div>
                    <button type="button" class="pen-btn" title="Edit currency details" onclick="openCustomEditModal(${c.id})">✎</button>
                </div>` : flagCell(c);

            rows += `
            <tr class="edit-row" draggable="true"
                ondragstart="onDragStart(event, ${c.id})"
                ondragend="onDragEnd(event)"
                ondragover="onDragOverRow(event, ${c.id})">
                <td class="drag-handle" title="Drag to reorder">⠿</td>
                <td class="col-num" data-label="#">${i + 1}</td>
                <td class="col-currency" data-label="Currency">${currencyCell}</td>
                <td class="col-unit" data-label="Unit"><input class="input" id="e-unit-${c.id}" type="number" min="1" step="1" value="${c.unit}"></td>
                <td class="col-rate" data-label="Buying Rate">
                    <input class="input" id="e-buying-${c.id}" type="number" value="${c.buyingRate}" step="any" min="0" ${c.buyPreorder?'disabled':''}>
                    <label class="preorder-lbl">
                        <input type="checkbox" id="e-buypreorder-${c.id}" ${c.buyPreorder?'checked':''} onchange="onPreorderToggle(${c.id},'buy')"> Pre-order
                    </label>
                </td>
                <td class="col-rate" data-label="Selling Rate">
                    <input class="input" id="e-selling-${c.id}" type="number" value="${c.sellingRate}" step="any" min="0" ${c.sellPreorder?'disabled':''}>
                    <label class="preorder-lbl">
                        <input type="checkbox" id="e-sellpreorder-${c.id}" ${c.sellPreorder?'checked':''} onchange="onPreorderToggle(${c.id},'sell')"> Pre-order
                    </label>
                </td>
                <td class="col-decimals" data-label="Decimals">
                    <select id="e-decimals-${c.id}" class="input">
                        ${[0,1,2,3,4,6,7,8,9].map(d=>`<option value="${d}" ${c.decimals===d?'selected':''}>${d}</option>`).join('')}
                    </select>
                </td>
                <td class="col-color" data-label="Color">${colorDropdownHtml(c)}</td>
                <td class="col-status" data-label="Status"><span class="${c.active?'badge-on':'badge-off'}">${c.active?'ON':'OFF'}</span></td>
                <td class="col-actions" data-label="Actions">
                    <div class="actions-cell">
                        <button class="btn btn-xs toggle-btn ${c.active?'on':'off'}" title="${c.active?'Turn OFF':'Turn ON'}" onclick="toggleCurrency(${c.id})">${c.active?'Off':'On'}</button>
                        <button class="btn btn-danger btn-xs del-btn" title="Delete" onclick="deleteCurrency(${c.id})">
                            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
                            Delete
                        </button>
                    </div>
                </td>
            </tr>`;
        } else {
            rows += `
            <tr>
                <td>${i + 1}</td>
                <td>${flagCell(c)}</td>
                <td>${c.buyPreorder ? '<span class="badge-preorder">PRE-ORDER</span>' : c.buyingRate.toFixed(c.decimals)}</td>
                <td>${c.sellPreorder ? '<span class="badge-preorder">PRE-ORDER</span>' : c.sellingRate.toFixed(c.decimals)}</td>
                <td><span class="${c.active?'badge-on':'badge-off'}">${c.active?'ON':'OFF'}</span></td>
            </tr>`;
        }
    });
    tbody.innerHTML = rows;
}

// ── Drag reorder (edit mode) ──

function onDragStart(e, id) {
    draggedId = id;
    e.dataTransfer.effectAllowed = "move";
    e.target.closest("tr").classList.add("dragging");
}

function onDragEnd() {
    document.querySelectorAll("tr.dragging").forEach(r => r.classList.remove("dragging"));
    draggedId = null;
}

function onDragOverRow(e, overId) {
    e.preventDefault();
    if (draggedId === null || draggedId === overId) return;
    const fromIdx = allData.findIndex(c => c.id === draggedId);
    const toIdx   = allData.findIndex(c => c.id === overId);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    const [moved] = allData.splice(fromIdx, 1);
    allData.splice(toIdx, 0, moved);
    reorderDirty = true;
    renderTable();
}

// ── Custom ("other") currency edit popup ──
// Only currencies not in CURRENCY_COUNTRY (i.e. custom ones) show the pen
// icon in edit mode; clicking it opens this popup instead of editing inline.

function openCustomEditModal(id) {
    const c = allData.find(x => x.id === id);
    if (!c) return;
    const edit = customEdits[id] || { currency: c.currency, currencyName: c.currencyName || "", currencyFlag: c.currencyFlag || "" };
    modalEditingId = id;
    document.getElementById("modal-code").value = edit.currency;
    document.getElementById("modal-name").value = edit.currencyName;
    const flagSelect = document.getElementById("modal-flag");
    flagSelect.value = edit.currencyFlag || "";
    if (flagSelect.value !== (edit.currencyFlag || "")) flagSelect.selectedIndex = 0; // fall back if code isn't in the list
    updateModalFlagPreview();
    document.getElementById("modal-error").style.display = "none";
    document.getElementById("customEditOverlay").classList.add("open");
}

function updateModalFlagPreview() {
    const flagSelect = document.getElementById("modal-flag");
    const preview = document.getElementById("modal-flag-preview");
    const selected = flagSelect.options[flagSelect.selectedIndex];
    if (selected) {
        preview.textContent = selected.textContent.split(" ")[0];
        preview.style.display = "block";
    } else {
        preview.textContent = "";
        preview.style.display = "none";
    }
}

function closeCustomEditModal() {
    document.getElementById("customEditOverlay").classList.remove("open");
    modalEditingId = null;
}

function saveCustomEditModal() {
    const modalError = document.getElementById("modal-error");
    const code = document.getElementById("modal-code").value.trim().toUpperCase();
    const name = document.getElementById("modal-name").value.trim();
    const flag = document.getElementById("modal-flag").value;

    if (!/^[A-Z]{3}$/.test(code)) {
        modalError.textContent = "Currency code must be exactly 3 letters, e.g. XAF.";
        modalError.style.display = "block";
        return;
    }
    if (!name) {
        modalError.textContent = "Please enter a currency name.";
        modalError.style.display = "block";
        return;
    }
    if (!flag) {
        modalError.textContent = "Please select a country / flag.";
        modalError.style.display = "block";
        return;
    }

    customEdits[modalEditingId] = { currency: code, currencyName: name, currencyFlag: flag };
    closeCustomEditModal();
    renderTable();
}

function onPreorderToggle(id, which) {
    const checked = document.getElementById(`e-${which}preorder-${id}`).checked;
    document.getElementById(`e-${which}-${id}`).disabled = checked;
}

function colorDropdownHtml(c) {
    const current = (c.rowColor || "").toUpperCase();
    const preset = ROW_COLOR_PRESETS.find(p => p.color.toUpperCase() === current);
    const isCustom = !!current && !preset;
    const selectedValue = !current ? "" : (preset ? preset.color : "custom");

    const presetOptions = ROW_COLOR_PRESETS.map(p => `
        <option value="${p.color}" style="color:${p.color};" ${selectedValue === p.color ? 'selected' : ''}>⬤ ${p.name}</option>`).join('');

    return `
        <div class="color-cell">
            <select class="input" id="e-rowcolor-${c.id}" onchange="onRowColorSelect(${c.id})">
                <option value="" ${selectedValue === "" ? 'selected' : ''}>No color</option>
                ${presetOptions}
                <option value="custom" ${selectedValue === "custom" ? 'selected' : ''}>Custom…</option>
            </select>
            <input type="color" class="color-custom-input" id="e-rowcolor-custom-${c.id}"
                value="${isCustom ? c.rowColor : '#f0c040'}" title="Custom color"
                style="${selectedValue === 'custom' ? '' : 'display:none;'}">
        </div>`;
}

function onRowColorSelect(id) {
    const select = document.getElementById(`e-rowcolor-${id}`);
    const customInput = document.getElementById(`e-rowcolor-custom-${id}`);
    customInput.style.display = select.value === "custom" ? "inline-block" : "none";
}

// ── Edit mode ──

window.toggleEditMode = function () {
    editModeActive = !editModeActive;
    document.getElementById("floatingSave").style.display = editModeActive ? "block" : "none";
    document.querySelectorAll(".edit-only").forEach(el => el.style.display = editModeActive ? "" : "none");
    document.body.classList.toggle("edit-mode", editModeActive);
    const navBtn = document.getElementById("navEditBtn");
    if (navBtn) navBtn.textContent = editModeActive ? "✕ Cancel" : "✎ Edit";

    if (editModeActive) {
        // Scroll the newly-expanded edit table into view so the person
        // isn't left staring at whatever they'd scrolled to before.
        setTimeout(() => document.querySelector(".table-wrap")?.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
    }

    if (!editModeActive) {
        reorderDirty = false;
        customEdits = {};
        loadCurrencies();
    } else {
        renderTable();
    }
};

async function saveAllChanges() {
    const updates = allData.map(c => {
        const buyPreorder  = document.getElementById(`e-buypreorder-${c.id}`).checked;
        const sellPreorder = document.getElementById(`e-sellpreorder-${c.id}`).checked;
        const buyingRate   = buyPreorder  ? 0 : parseFloat(document.getElementById(`e-buying-${c.id}`).value);
        const sellingRate  = sellPreorder ? 0 : parseFloat(document.getElementById(`e-selling-${c.id}`).value);
        const decimals     = parseInt(document.getElementById(`e-decimals-${c.id}`).value);
        const unit         = parseInt(document.getElementById(`e-unit-${c.id}`).value) || 1;
        const rowColorSelect = document.getElementById(`e-rowcolor-${c.id}`).value;
        const rowColor     = rowColorSelect === "custom"
            ? document.getElementById(`e-rowcolor-custom-${c.id}`).value
            : rowColorSelect;

        const isCustomEdit  = isCustomCurrency(c.currency);
        const edit          = customEdits[c.id];
        const currency      = edit ? edit.currency : c.currency;
        const currencyName  = edit ? edit.currencyName : (c.currencyName || "");
        const currencyFlag  = edit ? edit.currencyFlag : (c.currencyFlag || "");

        return { id: c.id, currency, currencyName, currencyFlag, unit, buyingRate, sellingRate, decimals, buyPreorder, sellPreorder, rowColor, isCustomEdit };
    });

    if (updates.some(u => isNaN(u.buyingRate) || isNaN(u.sellingRate))) {
        showError("Please fill in all rate fields, or mark them as pre-order, before saving.");
        return;
    }
    if (updates.some(u => u.isCustomEdit && !/^[A-Z]{3}$/.test(u.currency))) {
        showError("Custom currency codes must be exactly 3 letters, e.g. XAF.");
        return;
    }
    if (updates.some(u => u.isCustomEdit && !u.currencyName)) {
        showError("Please enter a name for each custom currency.");
        return;
    }
    if (updates.some(u => u.isCustomEdit && !/^[a-z]{2}$/.test(u.currencyFlag))) {
        showError("Please enter a valid 2-letter country code for each custom currency's flag, e.g. us.");
        return;
    }

    try {
        const results = await Promise.all(updates.map(u =>
            fetch(`/api/currencies/${u.id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                    currency: u.currency, unit: u.unit,
                    currencyName: u.currencyName, currencyFlag: u.currencyFlag,
                    buyingRate: u.buyingRate, sellingRate: u.sellingRate, decimals: u.decimals,
                    buyPreorder: u.buyPreorder, sellPreorder: u.sellPreorder, rowColor: u.rowColor
                })
            })
        ));

        if (reorderDirty) {
            await fetch("/api/currencies/reorder", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ order: allData.map(c => c.id) })
            });
            reorderDirty = false;
        }

        const failed = results.find(r => !r.ok);
        if (failed) {
            let msg = "Some currencies could not be saved.";
            try { msg = (await failed.json()).error || msg; } catch {}
            showError(msg);
        } else {
            hideError();
        }

        editModeActive = false;
        customEdits = {};
        document.getElementById("floatingSave").style.display = "none";
        document.querySelectorAll(".edit-only").forEach(el => el.style.display = "none");
        const navBtn = document.getElementById("navEditBtn");
        if (navBtn) navBtn.textContent = "✎ Edit";
        loadCurrencies();
        notifyBoardUpdate();
    } catch {
        showError("Could not reach server. Please try again.");
    }
}

async function toggleCurrency(id) {
    try {
        const res = await fetch(`/api/currencies/${id}/toggle`, { method: "POST", credentials: "include" });
        if (!res.ok) throw new Error();
        const c = allData.find(x => x.id === id);
        if (c) c.active = !c.active;
        renderTable();
        notifyBoardUpdate();
    } catch { showError("Could not toggle."); }
}

async function deleteCurrency(id) {
    if (!confirm("Delete this currency?")) return;
    try {
        const res = await fetch(`/api/currencies/${id}`, { method: "DELETE", credentials: "include" });
        if (!res.ok) throw new Error();
        loadCurrencies();
        notifyBoardUpdate();
    } catch { showError("Could not delete."); }
}

// ── Page meta: board color tint + View Live Board link ──
// (Full Board Settings — color picker, logo, font size, etc. — now lives on
// its own page: board-settings.html)

// Given a hex color, returns "#1a1a2e" (dark) or "#ffffff" (light) —
// whichever gives better contrast against it — using relative luminance.
function contrastTextColor(hex) {
    const c = (hex || "").replace("#", "");
    if (!/^[0-9a-fA-F]{6}$/.test(c)) return "#1a1a2e";
    const r = parseInt(c.slice(0, 2), 16) / 255;
    const g = parseInt(c.slice(2, 4), 16) / 255;
    const b = parseInt(c.slice(4, 6), 16) / 255;
    const lin = v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    const luminance = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    return luminance > 0.5 ? "#1a1a2e" : "#ffffff";
}

async function loadPageMeta() {
    try {
        const res = await fetch("/api/me", { credentials: "include" });
        if (!res.ok) return;
        const data = await res.json();
        const boardColor = data.boardColor || "#1a1a2e";
        document.body.style.background = boardColor;

        const textColor = contrastTextColor(boardColor);
        const headerH2 = document.querySelector(".page-header-text h2");
        const headerP  = document.querySelector(".page-header-text p");
        if (headerH2) headerH2.style.color = textColor;
        if (headerP)  headerP.style.color  = textColor === "#ffffff" ? "rgba(255,255,255,0.75)" : "#666";

        const viewBoardBtn = document.getElementById("viewBoardBtn");
        if (viewBoardBtn && data.id) {
            viewBoardBtn.href = `/boards.html?user=${data.id}`;
        }
    } catch { /* non-fatal */ }
}

loadCurrencies();
loadPageMeta();

// If the user clicked "Edit" from another page, jump straight into edit
// mode once currencies have loaded (navbar.js sets this flag).
if (sessionStorage.getItem("showcash_enter_edit") === "1") {
    sessionStorage.removeItem("showcash_enter_edit");
    setTimeout(() => { if (typeof window.toggleEditMode === "function") window.toggleEditMode(); }, 300);
}
</script>
